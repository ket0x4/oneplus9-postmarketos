# Checks the parts of the tree the kernel build never touches: rootfs/ (shell
# helpers, systemd units, udev rules), postmarketos/ (APKBUILDs and patches) and the
# tools/ programs. None of this needs a cross toolchain or a phone, so it is a
# few minutes, and it catches the class of breakage that otherwise only shows up
# on hardware: a unit that runs a missing binary, a udev rule that does not
# parse, a patch that no longer matches its package, a broken doc link.
#
# The reproducibility job is the exception: it builds the initramfs twice and
# fails unless the two are byte-identical, which is the cheap half of "the same
# inputs give the same artifact".
#
# Every check runs the same command you can run locally from the repo root:
#   python3 .github/checks/docs-links.py
#   python3 .github/checks/apkbuild-sums.py
#   python3 .github/checks/apply-patches.py
#   python3 .github/checks/desktop-entries.py
#   python3 tests/test_desktop_mode.py
#   .github/checks/reproducible-initramfs.sh
name: Tree checks

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

env:
  SCRIPTS: |
    initramfs/init
    initramfs/build.sh
    initramfs/busybox.sh
    kernel/build.sh
    scripts/mkboot.sh
    scripts/op9-boot-image.sh
    scripts/op9-nat.sh
    postmarketos/build-pmos-image.sh
    postmarketos/apk-triggers/op9-no-splash.sh
    rootfs/usr/local/bin/charge-status
    rootfs/usr/local/bin/op9-addresses
    rootfs/usr/local/bin/op9-battery-line
    rootfs/usr/local/bin/op9-boot-successful
    rootfs/usr/local/bin/op9-callaudio
    rootfs/usr/local/bin/op9-desktop
    rootfs/usr/local/bin/op9-desktop-input
    rootfs/usr/local/bin/op9-desktop-lease
    rootfs/usr/local/bin/op9-desktop-session
    rootfs/usr/local/bin/op9-devcoredump
    rootfs/usr/local/bin/op9-gadget-bind
    rootfs/usr/local/bin/op9-kms-reset
    rootfs/usr/local/bin/op9-lockup-watch
    rootfs/usr/local/bin/op9-no-splash
    rootfs/usr/local/bin/op9-sim-provision
    rootfs/usr/local/bin/op9-sunlight-hbm
    rootfs/usr/local/bin/rtc-offset
    rootfs/usr/local/bin/ssc-wait
    rootfs/usr/local/bin/steam-fex
    rootfs/usr/local/bin/usb-gadget-ensure
    rootfs/etc/tuned/profiles/op9-balanced/script.sh
    rootfs/etc/tuned/profiles/op9-powersave/script.sh
    rootfs/etc/tuned/profiles/op9-performance/script.sh

jobs:
  scripts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0

      - name: Syntax, with the interpreter each script declares
        run: |
          fail=0
          while IFS= read -r f; do
            [ -e "$f" ] || continue
            case "$(head -1 "$f")" in
              *bash*) bash -n "$f" || { echo "::error file=$f::bash syntax"; fail=1; } ;;
              *sh*)   sh   -n "$f" || { echo "::error file=$f::sh syntax"; fail=1; } ;;
              *python3*)
                python3 -c "import ast,sys; ast.parse(open(sys.argv[1]).read(), sys.argv[1])" "$f" ||
                  { echo "::error file=$f::python syntax"; fail=1; } ;;
              *) echo "::warning file=$f::no recognised interpreter line" ;;
            esac
          done <<< "$SCRIPTS"
          exit $fail

      - name: Python tools compile
        run: |
          python3 -m compileall -q tools .github/checks
          find tools .github/checks -name __pycache__ -prune -exec rm -rf {} +

      - name: tools/ C programs compile
        run: |
          # build-pmos-image.sh compiles touchboost, alert-slider and op9-slot for
          # the phone; bringup/ holds probes that only run on hardware. Building the
          # whole set here keeps a broken one from reaching a release.
          fail=0
          for src in tools/*.c tools/bringup/*.c; do
            gcc -O2 -Wall -Wextra -c "$src" -o /tmp/"$(basename "$src" .c)".o ||
              { echo "::error file=$src::does not compile"; fail=1; }
          done
          exit $fail

      - name: Shellcheck
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends shellcheck
          # Only files whose first line is a shell: shellcheck errors out (SC1071) on
          # the Python helpers, and -S warning keeps notes like SC2086 on
          # deliberately unquoted sysfs paths from failing the job.
          shell=()
          while IFS= read -r f; do
            [ -e "$f" ] || continue
            case "$(head -1 "$f")" in
              *bash*|*'/bin/sh'*) shell+=("$f") ;;
            esac
          done <<< "$SCRIPTS"
          shellcheck -S warning -x "${shell[@]}"

  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0

      - name: Install python3-gi and the GI namespaces the scripts import
        # op9-desktop imports Gtk 4, Adw and GUdev at module level, so the test
        # cannot even load it without all three typelibs. The settings round-trip
        # needs the real schemas too; without them it would only skip.
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends \
            python3-gi python3-gi-cairo \
            gir1.2-gtk-4.0 gir1.2-adw-1 gir1.2-gudev-1.0 \
            gsettings-desktop-schemas gnome-settings-daemon-common

      - name: Every namespace the scripts import is available
        # Catch a missing typelib here, with a message that says which package to
        # add, rather than as a ValueError traceback from the module import.
        run: |
          fail=0
          for ns in Gtk:4.0 Adw:1 GUdev:1.0 Gio:2.0 GLib:2.0; do
            name=${ns%%:*}; ver=${ns##*:}
            if ! python3 -c "import gi; gi.require_version('$name','$ver')" 2>/dev/null; then
              echo "::error::GI namespace $name $ver is not available (needs a gir1.2-* package)"
              fail=1
            fi
          done
          exit $fail

      - name: The schemas the settings test needs are present
        # A missing schema turns two tests into skips, which would let a broken
        # round-trip pass CI unnoticed. Fail here instead.
        run: |
          for s in org.gnome.desktop.lockdown org.gnome.settings-daemon.plugins.power; do
            if ! ls /usr/share/glib-2.0/schemas/ | grep -qx "$s.gschema.xml"; then
              echo "::error::schema $s is not installed; the settings test would only skip"
              exit 1
            fi
          done

      - name: Desktop mode logic
        run: python3 tests/test_desktop_mode.py

  udev:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
      - name: Verify udev rules
        run: |
          # The fastrpc group comes from hexagonrpc's sysusers file on the phone, so
          # create it here. Otherwise every rule naming it "fails" for a missing
          # group, which masks real errors in the same file.
          sudo groupadd --system fastrpc
          udevadm verify rootfs/etc/udev/rules.d/*.rules

  pmaports:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0

      - name: APKBUILD metadata and checksums
        run: python3 .github/checks/apkbuild-sums.py

      - name: Patch files apply to the pinned upstream revision
        # Static checks can't tell whether a hunk still lines up; this fetches each
        # package's source at its pinned commit and runs the same `git apply
        # --check` that abuild's `default_prepare` needs to succeed on the phone.
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends git
          python3 .github/checks/apply-patches.py

  units:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
      - name: Desktop launchers and the image builder's unit list
        # The units job below proves every unit's Exec points at something that
        # exists. This does the same for .desktop Exec lines and for the units
        # populate-mounted-rootfs.sh enables, both of which have named a missing
        # file before without any check noticing.
        run: python3 .github/checks/desktop-entries.py
      - name: ExecStart binaries exist in rootfs/
        run: |
          # /usr/local/bin is either this repo's own scripts or a tool compiled
          # from tools/ by postmarketos/GUIDE.md; anything else must exist in rootfs/.
          # /usr/bin and /usr/sbin belong to Arch packages, which are not in the
          # tree, so those are only listed here to catch an obvious typo.
          # Strip systemd's Exec prefixes (+, -, @, !, :) before reading the path.
          normalise() { sed -E 's/^[^=]*=//; s/^[+@!:-]+//; s/ .*//'; }
          fail=0
          for u in rootfs/etc/systemd/system/*.service rootfs/etc/systemd/user/*.service; do
            [ -e "$u" ] || continue
            while IFS= read -r bin; do
              case "$bin" in
                /usr/local/bin/*)
                  [ -e "rootfs$bin" ] ||
                  [ -e "tools/${bin##*/}.c" ] || [ -e "tools/bringup/${bin##*/}.c" ] ||
                    { echo "::error file=$u::runs $bin, which is neither in rootfs/ nor built from tools/"; fail=1; } ;;
                /usr/bin/*|/usr/sbin/*)
                  grep -qx "$bin" .github/checks/system-binaries.txt ||
                    { echo "::error file=$u::runs $bin, not in the packaged-binary allowlist"; fail=1; } ;;
              esac
            done < <(grep -hE '^(ExecStart|ExecStartPre|ExecStartPost|ExecStop|ExecStopPost)=/' "$u" | normalise | sort -u)
          done
          exit $fail

  reproducible:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
      - name: Install the cross toolchain
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends \
            gcc-aarch64-linux-gnu libc6-dev-arm64-cross bc flex libssl-dev libelf-dev \
            cpio bzip2
      - name: The initramfs builds identically twice
        run: .github/checks/reproducible-initramfs.sh

  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
      - name: Relative links resolve, no absolute local paths
        run: python3 .github/checks/docs-links.py
      - name: No credentials committed
        run: |
          # A real credential has no placeholder in it: the guide documents
          # `/p:<password>`, which is not a secret. Exclude angle-bracket text.
          if git grep -nIE '(\s/p:[^ <]+|BEGIN [A-Z ]*PRIVATE KEY)' |
               grep -vE '\.patch:|LICENSE'; then
            echo "::error::possible credential committed"
            exit 1
          fi
