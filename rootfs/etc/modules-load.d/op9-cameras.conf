# CAMSS's v4l2 async notifier waits for every sensor in the device tree, so one
# sensor driver that never loads leaves the notifier pending and no camera is
# registered at all: mediatopology is empty and libcamera reports "No sensor
# found" even though the other sensors bound. Load them explicitly so this can't
# depend on udev's modalias autoload, which a modprobe.d blacklist silently
# defeats (that is how the mono camera alone hid all four).
#
# The image is shared by both phones, so this lists all of them; the OnePlus 9
# has no telephoto, where ov08a10 simply loads without matching a device.
imx789
imx471
gc02m1b
ov08a10
