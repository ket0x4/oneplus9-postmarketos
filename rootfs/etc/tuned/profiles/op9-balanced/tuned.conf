#
# OnePlus 9 / 9 Pro (Snapdragon 888 / SM8350) - Balanced profile
#

[main]
summary=OnePlus 9 / 9 Pro balanced profile (smooth 120 Hz UI, trimmed top-bin A78/X1 voltage spikes)

[sysctl]
kernel.sched_energy_aware=0
kernel.nmi_watchdog=0
vm.dirty_writeback_centisecs=1500

[script]
script=${i:PROFILE_DIR}/script.sh
