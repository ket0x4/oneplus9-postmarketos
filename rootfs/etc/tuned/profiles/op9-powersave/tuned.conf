#
# OnePlus 9 / 9 Pro (Snapdragon 888 / SM8350) - Power Saver profile
#

[main]
summary=OnePlus 9 / 9 Pro power-saver profile (EAS enabled, capped A78/X1/GPU clocks)

[sysctl]
kernel.sched_energy_aware=1
kernel.nmi_watchdog=0
vm.dirty_writeback_centisecs=1500

[script]
script=${i:PROFILE_DIR}/script.sh
