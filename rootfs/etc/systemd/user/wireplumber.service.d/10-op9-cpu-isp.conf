# The GPU (EGL) software ISP breaks the PipeWire libcamera node on this port:
# the camera app's stream fails with "target not found" for the 2000x1128 stream
# it negotiates, while `cam` works. Default WirePlumber's camera provider to the
# CPU debayer, which streams correctly. Set this to "gpu" to experiment; a
# process can also override it, e.g. LIBCAMERA_SOFTISP_MODE=gpu cam ...
[Service]
Environment=LIBCAMERA_SOFTISP_MODE=cpu
