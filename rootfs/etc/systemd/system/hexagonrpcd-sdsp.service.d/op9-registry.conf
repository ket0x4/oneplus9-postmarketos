[Service]
# Point the SLPI file server at this phone's sensor registry. The path says
# "lemonade" on both phones: that is where OnePlus's own firmware layout puts the
# directory, not a board name, and it is what the shared sm8350-oneplus-common.dtsi
# and the stock DTBO expect. Same reason as qcom/sm8350/OnePlus/lemonade/ for the
# firmware itself.
ExecStart=
ExecStart=/usr/bin/hexagonrpcd -f /dev/fastrpc-sdsp -d sdsp -s -R /usr/share/qcom/sm8350/OnePlus/lemonade
