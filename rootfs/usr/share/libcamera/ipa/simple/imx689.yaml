# SPDX-License-Identifier: CC0-1.0
# OnePlus 9 main camera (IMX689); the sensor black level is 64 (10-bit)
#
# The colour correction matrices are stock OxygenOS normal-light tuning
# (com.qti.tuned.semco_imx689.bin). Stock holds each matrix flat across a colour-temperature
# range and blends between ranges; listing each matrix at both ends of its range
# makes libcamera's linear interpolation do the same.
%YAML 1.1
---
version: 1
algorithms:
  - BlackLevel:
      blackLevel: 4096
  - Awb:
  - Ccm:
      ccms:
        - ct: 2450
          ccm: [  0.9948,  0.1339, -0.1289,
                 -0.5890,  1.6048, -0.0159,
                 -0.1579, -1.0785,  2.2362 ]
        - ct: 2600
          ccm: [  1.0897,  0.5107, -0.6004,
                 -0.4220,  1.5296, -0.1078,
                 -0.0956, -0.7539,  1.8489 ]
        - ct: 3400
          ccm: [  1.0897,  0.5107, -0.6004,
                 -0.4220,  1.5296, -0.1078,
                 -0.0956, -0.7539,  1.8489 ]
        - ct: 3650
          ccm: [  1.3393, -0.3536,  0.0143,
                 -0.3881,  1.5286, -0.1404,
                  0.0228, -0.6307,  1.6080 ]
        - ct: 4500
          ccm: [  1.3393, -0.3536,  0.0143,
                 -0.3881,  1.5286, -0.1404,
                  0.0228, -0.6307,  1.6080 ]
        - ct: 4850
          ccm: [  1.5824, -0.7251,  0.1428,
                 -0.2660,  1.4575, -0.1915,
                  0.0286, -0.6704,  1.6419 ]
  - Adjust:
      highlightKnee: 0.85
      sharpen: 0.0
      denoise: 0.0
  - Agc:
  - Af:
...
